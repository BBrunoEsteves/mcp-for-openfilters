name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build C++ extensions in place
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py build_ext --inplace
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check that the compiled core is used
        run: python -c "from openfilters_mcp import engine; s = engine.acceleration_status(); print(s); assert all(s.values())"
      - name: Tests (compiled core)
        run: python -m pytest tests -q
      - name: Tests (pure-Python core)
        env:
          OPENFILTERS_PURE_PYTHON: "1"
        run: python -m pytest tests -q

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: test
    # Build unless a test actually failed (a test job cancelled because no
    # runner was available, as happens with macOS capacity, does not block).
    if: ${{ always() && needs.test.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          # Load the compiled core before anything imports NumPy (NumPy can
          # mask a missing bundled runtime library).
          CIBW_TEST_COMMAND: >-
            python -c "from openfilters_core import abeles, moremath; s = (abeles.get_abeles_dll_import_success(), moremath.get_moremath_dll_import_success()); print(s); assert all(s)"
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  release:
    name: GitHub release
    needs: wheels
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.wheels.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Create the release with all packages and the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install_openfilters_mcp.py dist/
          gh release create "${GITHUB_REF_NAME}" dist/*             --title "OpenFilters MCP ${GITHUB_REF_NAME}"             --notes-file scripts/RELEASE_NOTES.md
