name: CI

# Ordinary pushes test on Linux only: on a private repository GitHub bills macOS
# minutes 10x and Windows 2x. Release tags and manual runs (Actions > CI > Run
# workflow) test every system and build the wheels; set the repository variable
# FULL_CI to "true" to do that on every push (free once the repository is public).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "CITATION.cff", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || vars.FULL_CI == 'true') && '["windows-latest", "ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || vars.FULL_CI == 'true') && '["3.11", "3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build C++ extensions in place
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py build_ext --inplace
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check that the compiled core is used
        run: python -c "from mcp_for_openfilters import engine; s = engine.acceleration_status(); print(s); assert all(s.values())"
      - name: Tests (compiled core)
        run: python -m pytest tests -q
      - name: Tests (pure-Python core)
        env:
          OPENFILTERS_PURE_PYTHON: "1"
        run: python -m pytest tests -q

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: test
    # Build unless a test actually failed (a test job cancelled because no
    # runner was available, as happens with macOS capacity, does not block).
    if: ${{ always() && needs.test.result != 'failure' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || vars.FULL_CI == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheels
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          # Load the compiled core before anything imports NumPy (NumPy can
          # mask a missing bundled runtime library).
          CIBW_TEST_COMMAND: >-
            python -c "from openfilters_core import abeles, moremath; s = (abeles.get_abeles_dll_import_success(), moremath.get_moremath_dll_import_success()); print(s); assert all(s)"
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source package
    needs: test
    if: ${{ always() && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build --sdist
      # Platforms without a wheel install from source: the compiled core must
      # build from the sdist alone (it falls back silently to pure Python otherwise).
      - name: Install from source and check the compiled core
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install dist/*.tar.gz
          cd /tmp && /tmp/sdist-env/bin/python -c "from mcp_for_openfilters import engine; s = engine.acceleration_status(); print(s); assert all(s.values())"
      - name: Validate the Claude Desktop extension manifest
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate packaging/mcpb/manifest.json
      # The one-click Claude Desktop extension: a small wrapper that installs the PyPI package with uv.
      - name: Pack the Claude Desktop extension
        run: |
          version=$(python -c "import json; print(json.load(open('packaging/mcpb/manifest.json'))['version'])")
          mkdir -p mcpb-out
          npx -y @anthropic-ai/mcpb@2.1.2 pack packaging/mcpb "mcpb-out/mcp-for-openfilters-${version}.mcpb"
          ls -l mcpb-out
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: mcpb-out/*.mcpb

  release:
    name: GitHub release
    needs: [wheels, sdist]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.wheels.result == 'success' && needs.sdist.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: dist
      - name: Create the release with all packages and the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install_mcp_for_openfilters.py dist/
          gh release create "${GITHUB_REF_NAME}" dist/*             --title "MCP for OpenFilters ${GITHUB_REF_NAME}"             --notes-file scripts/RELEASE_NOTES.md

  pypi:
    name: Publish to PyPI
    needs: release
    # Off until PyPI trusted publishing is configured: then set the repository
    # variable PUBLISH_PYPI to "true" (Settings > Secrets and variables > Actions).
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
