name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build C++ extensions in place
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py build_ext --inplace
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check that the compiled core is used
        run: python -c "from openfilters_mcp import engine; s = engine.acceleration_status(); print(s); assert all(s.values())"
      - name: Tests (compiled core)
        run: python -m pytest tests -q
      - name: Tests (pure-Python core)
        env:
          OPENFILTERS_PURE_PYTHON: "1"
        run: python -m pytest tests -q

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          CIBW_TEST_COMMAND: >-
            python -c "from openfilters_mcp import engine; s = engine.acceleration_status(); print(s); assert all(s.values())"
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
